# Project Aether — CI/CD Pipeline (AUDIT C10)
#
# Runs lint, tests, and build on every push and PR. Caches npm deps for speed.
# Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF as GitHub secrets to
# enable the deploy job (manual trigger only — never auto-deploy to prod).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build with empty Supabase vars so the demo/empty-state path
          # compiles. Real env vars are only needed at runtime.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

  deploy-functions:
    name: Deploy Edge Functions (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: lint-test-build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy ingest-mqtt --no-verify-jwt
          supabase functions deploy evaluate-alerts --no-verify-jwt
          supabase functions deploy claim-node
          supabase functions deploy weekly-summary --no-verify-jwt
          supabase functions deploy latest-readings
